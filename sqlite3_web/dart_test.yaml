compilers: [dart2wasm, dart2js]

tags:
  webdriver:
    # Sometimes spawning the driver times out, it's just easier to retry.
    retry: 2

override_platforms:
  firefox:
    settings:
      arguments: "-headless"

on_os:
  linux:
    platforms: [vm, chrome, firefox]
  windows:
    platforms: [vm, chrome, firefox]
  mac-os:
    platforms: [vm, chrome, firefox, safari]

presets:
  gh_actions:
    concurrency: 1
